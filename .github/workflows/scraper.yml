name: Bot FC Porto Bilhetes

on:
  schedule:
    - cron: '*/5 * * * *' # Instrução para correr a cada 5 minutos
  workflow_dispatch: # Adiciona um botão para podermos testar manualmente quando quisermos

jobs:
  verificar-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dá permissão para o bot escrever o ficheiro de memória no repositório

    steps:
      - name: 1. Puxar o Código
        uses: actions/checkout@v4

      - name: 2. Preparar o ambiente C# (.NET 8)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' 

      - name: 3. Correr o Bot
        env:
          # Aqui o GitHub tira o link do cofre e passa-o ao teu código
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # Vai procurar um projeto com este nome (vamos usar este nome quando criarmos o código)
        run: dotnet run

      - name: 4. Guardar a Memória
        run: |
          git config --global user.name "Bot Bilheteira"
          git config --global user.email "actions@github.com"
          git add ultimo_aviso.txt
          # Se o ficheiro da memória mudar, ele guarda. Se não mudar, não faz nada (|| true evita erros)
          git commit -m "Atualiza memória dos bilhetes [skip ci]" || true
          git push
